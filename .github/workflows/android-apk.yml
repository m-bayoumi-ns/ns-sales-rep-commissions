name: Android APK

# Builds the NS Commissions WebView app (android/), publishes it on the website as
# public/downloads/ns-commissions-web.apk (served when Settings → Android app download = web) and as a GitHub Release.
# The native app (android-native-apk.yml) publishes public/downloads/ns-commissions.apk.
# Runs when anything under android/ changes, or by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Spaces or line breaks added while pasting the secret are removed before decoding.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' > "$RUNNER_TEMP/key.b64"
            echo "Secret length after cleanup: $(wc -c < "$RUNNER_TEMP/key.b64") characters (expected 5836)"
            if ! base64 -d "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/release.jks"; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste the whole content of keystore-base64.txt again."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')" -alias "$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')" > /dev/null; then
              echo "::error::The keystore opened but the password or alias secret does not match it."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing; the APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NS-Commissions-1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Publish APK on the website
        # Only commits files outside android/, so this does not start another build.
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          cp "dist/NS-Commissions-1.0.${GITHUB_RUN_NUMBER}.apk" public/downloads/ns-commissions-web.apk
          BYTES=$(stat -c %s public/downloads/ns-commissions-web.apk)
          printf '{\n  "version": "1.0.%s",\n  "bytes": %s,\n  "publishedAt": "%s"\n}\n' "$GITHUB_RUN_NUMBER" "$BYTES" "$(date -u +%Y-%m-%d)" > lib/android-release-web.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ns-commissions-web.apk lib/android-release-web.json
          git commit -m "Android WebView app 1.0.${GITHUB_RUN_NUMBER} on the website"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        with:
          name: NS-Commissions-APK
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: NS Commissions 1.0.${{ github.run_number }}
          body: |
            Android app for Sales Rep Commissions.
            Download the APK below on the phone and open it to install
            (allow "Install unknown apps" for the browser or Files app when Android asks).
          files: dist/*.apk
          make_latest: true
