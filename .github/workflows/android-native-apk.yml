name: Android Native APK

# Builds the NS Commissions Native app (android-native/, Kotlin + Jetpack Compose),
# publishes it on the website as public/downloads/ns-commissions.apk and as a GitHub Release.
# Runs when anything under android-native/ changes, or manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' > "$RUNNER_TEMP/key.b64"
            if ! base64 -d "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/release.jks"; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')" -alias "$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')" > /dev/null; then
              echo "::error::The keystore opened but the password or alias secret does not match it."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing; the APK is signed with debug or local key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android-native --no-daemon assembleRelease --stacktrace 2>&1 | tee build.log || {
            echo "### Gradle Build Error" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android-native/app/build/outputs/apk/release/app-release.apk "dist/NS-Commissions-Native-2.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Publish APK on the website
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          cp "dist/NS-Commissions-Native-2.0.${GITHUB_RUN_NUMBER}.apk" public/downloads/ns-commissions.apk
          BYTES=$(stat -c %s public/downloads/ns-commissions.apk)
          printf '{\n  "version": "2.0.%s",\n  "bytes": %s,\n  "publishedAt": "%s",\n  "variant": "native"\n}\n' "$GITHUB_RUN_NUMBER" "$BYTES" "$(date -u +%Y-%m-%d)" > lib/android-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ns-commissions.apk lib/android-release.json
          git commit -m "Android Native app 2.0.${GITHUB_RUN_NUMBER} on the website"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        with:
          name: NS-Commissions-Native-APK
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-v2.0.${{ github.run_number }}
          name: NS Commissions Native 2.0.${{ github.run_number }}
          body: |
            Native Android app (Kotlin + Jetpack Compose) for Naguib Selim Sales Rep Commissions.
            Download the APK below on the phone and open it to install.
          files: dist/*.apk
          make_latest: true
