name: NSCommissions
options:
  bundleIdPrefix: com.naguibselim
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  developmentLanguage: ar

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "2.0.27"
    CURRENT_PROJECT_VERSION: "27"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  NSCommissions:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NSCommissions
        excludes:
          - Info.plist
    info:
      path: NSCommissions/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naguibselim.commissionsapp
        INFOPLIST_FILE: NSCommissions/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
