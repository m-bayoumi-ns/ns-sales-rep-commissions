plugins {
    id "com.android.application"
}

// Version: CI passes the run number so every build installs over the previous one.
def ciBuild = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Release signing comes from environment variables (GitHub Actions secrets).
// Without them the release build falls back to the debug key, which still installs fine.
def ksFile = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseKey = ksFile != null && file(ksFile).exists()

android {
    namespace "com.naguibselim.commissions"
    compileSdk 34

    defaultConfig {
        applicationId "com.naguibselim.commissions"
        minSdk 24
        targetSdk 34
        versionCode ciBuild
        versionName "1.0.${ciBuild}"

        // The website the app opens. Change here if the domain changes.
        buildConfigField "String", "START_URL", "\"https://ns-sales-rep-commissions.vercel.app/\""
        resourceConfigurations += ["en", "ar"]
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")?.trim()
                keyAlias System.getenv("ANDROID_KEY_ALIAS")?.trim()
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")?.trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.work:work-runtime:2.9.1"
}
